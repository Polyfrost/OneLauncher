name: Publish Changelog

on:
  release:
    types: [published, edited]
  workflow_dispatch:

concurrency:
  group: changelog-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The launcher reads releases/latest/download/changelog.json, so the
      # snapshot of the last 50 release bodies always lives on the latest release.
      - name: Build changelog.json from release bodies
        run: |
          gh api "repos/$GH_REPO/releases?per_page=50" --jq '[.[]
            | select(.draft | not)
            | select(.tag_name | startswith("oneclient-"))
            | {
                version: (.tag_name | ltrimstr("oneclient-")),
                body: ((.body // "") | sub("^Automated release for OneClient [^\n]*\\s*"; ""))
              }]' > changelog.json
          jq -r '.[].version' changelog.json

      # GitHub's "latest" pointer lags a few seconds behind a fresh publish, so
      # on publish upload to the triggering release instead of asking for latest.
      - name: Upload to latest release
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$EVENT_ACTION" = published ] && [ "$EVENT_PRERELEASE" != true ]; then
            TAG="$EVENT_TAG"
          else
            TAG="$(gh release view --json tagName -q .tagName)"
          fi
          echo "Uploading to $TAG"
          gh release upload "$TAG" changelog.json --clobber
