project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true

files:
  - source: /packages/oneclient_app/lang/en_us.json
    dest: /oneclient.json
    translation: /translations/%locale_with_underscore%/oneclient.json
    update_option: update_as_unapproved
    languages_mapping:
      locale_with_underscore:
        nb: no_NO
